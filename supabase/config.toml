# Supabase CLI configuration for the Famara local stack.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
# Storage buckets are created by migrations (supabase/migrations/*_storage.sql), not here, so the
# hosted project and the local stack are configured from a single source.

project_id = "famara"

[api]
enabled = true
port = 54321
# Only these schemas are reachable through the Data API. `private` is never exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Global ceiling; per-bucket limits (set in migrations) are stricter.
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "famara://"
additional_redirect_urls = [
  "famara://auth/callback",
  "exp://127.0.0.1:8081/--/auth/callback",
  "exp://localhost:8081/--/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enabled = false

[auth.mfa]
max_enrolled_factors = 10

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[edge_runtime.secrets]
ANTHROPIC_API_KEY = "env(ANTHROPIC_API_KEY)"

[analytics]
enabled = false
